<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
        <div class="card w-50">
            <div class="card-title p-3">
                <h2 class="text-center">Login</h2>
            </div>
            <div class="card-body">
                <form action="" method="POST">
                    <label for="Username">Username</label>
                    <input type='text' class='form-control mb-3' name='Username' id='Username' placeholder='Username'>
                    <label for="Password">Password</label>
                    <div class="input-group">
                        <input type='password' class='form-control' name='Password' id='Password' placeholder='Password'
                            aria-describedby="show-password">
                        <button type="button" class="btn btn-secondary" id="show-password" onclick="showPassword()"><i
                                class="bi bi-eye-slash-fill" id="Icons"></i></button>
                    </div>
                    <p class="pt-3">Belum Memiliki Akun?<a href="register.html">Daftar Sekarang!</a></p>
                    
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
            </div>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
