<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <title>TechNews - Portal Berita Teknologi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/admin-dashboard.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.min.js"></script> -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <!-- <link rel="stylesheet" href="css/style.css"> -->
</head>

<body data-bs-theme="dark" class="overflow-hidden"> <!-- Menghilangkan scroll bar utama pada body -->
    <!-- Menggunakan min-vh-100 dan 100dvh sebagai pembatas utama layar -->
    <div class="container-fluid p-3" style="height: 100dvh; max-height: 100dvh;">
        <div class="row h-100 g-3"> <!-- g-3 untuk jarak antar card yang konsisten -->

            <!-- SIDEBAR PANEL -->
            <div class="col-sm-12 col-md-3 h-100">
                <div class="card h-100 p-3 sidebar-panel">
                    <div class="card-header d-flex align-items-center mb-3">
                        <img src="profile.png" alt="" width="48">
                        <span class="fw-bold fs-3 text-center ps-3">Dashboard</span>
                    </div>
                    <div class="d-flex flex-column gap-2">
                        <a href="" class="btn btn-tertiary text-start p-2">Home</a>
                        <button type="button" class="btn btn-tertiary text-start p-2" onclick="muatHalaman('dashboard-berita.html')">Berita</button>
                        <a href="" class="btn btn-tertiary text-start p-2">Langganan</a>
                        <a href="" class="btn btn-tertiary text-start p-2">Penerbit</a>
                        <!-- <a href="" class="btn btn-tertiary text-start p-2">Logout</a> -->
                    </div>
                    <a href="" class="btn btn-tertiary text-end p-2 mt-auto">Logout</a>
                    
                </div>
            </div>

            <!-- MAIN CONTENT PANEL -->
            <!-- col-md-9 disesuaikan agar pas berpasangan dengan col-md-3 -->
            <div class="col-sm-12 col-md-9 h-100">
                <div class="card p-3 h-100">
                    <!-- Area Scroll Hanya Ada di Dalam Konten Saja -->
                    <div id="content" class="overflow-y-auto overflow-x-hidden h-100 pe-2">
                        <div class="row g-3">

                            <!-- INFO BOXES -->
                            <div class="col-sm-12 col-md-4">
                                <div class="card p-3 text-center">
                                    <span class="fw-bold fs-5 text-muted">Total Berita</span>
                                    <span class="fw-bold fs-3 text-primary">900.000</span>
                                </div>
                            </div>
                            <div class="col-sm-12 col-md-4">
                                <div class="card p-3 text-center">
                                    <span class="fw-bold fs-5 text-muted">Total Penerbit</span>
                                    <span class="fw-bold fs-3 text-success">900.000</span>
                                </div>
                            </div>
                            <div class="col-sm-12 col-md-4">
                                <div class="card p-3 text-center">
                                    <span class="fw-bold fs-5 text-muted">Total Langganan</span>
                                    <span class="fw-bold fs-3 text-warning">90.000</span>
                                </div>
                            </div>

                            <!-- GRAFIK 1 -->
                            <div class="col-sm-12">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="fw-bold mb-0">Tabel Pendapatan 1</h6>
                                    </div>
                                    <div class="card-body p-2">
                                        <div style="position: relative; height:200px; width: 100%;">
                                            <canvas id="grafikSaya"></canvas>
                                        </div>
                                        <script>
                                            const ctx = document.getElementById('grafikSaya').getContext('2d');
                                            const grafikSaya = new Chart(ctx, {
                                                type: 'line',
                                                data: {
                                                    labels: ['Januari', 'Februari', 'Maret', 'April', 'Mei'],
                                                    datasets: [{
                                                        label: 'Penjualan Produk A',
                                                        data:[12,32,12,45,64,34,12],
                                                        backgroundColor: 'rgba(54, 162, 235, 0.5)',
                                                        borderColor: 'rgba(54, 162, 235, 1)',
                                                        borderWidth: 1
                                                    }]
                                                },
                                                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                                            });
                                        </script>
                                    </div>
                                </div>
                            </div>

                            <!-- GRAFIK 2 -->
                            <div class="col-sm-12">
                                <div class="card">
                                    <div class="card-header">
                                        <h6 class="fw-bold mb-0">Tabel Pendapatan 2</h6>
                                    </div>
                                    <div class="card-body p-2">
                                        <div style="position: relative; height:200px; width: 100%;">
                                            <canvas id="grafikSaya1"></canvas>
                                        </div>
                                        <script>
                                            // PERBAIKAN: Menggunakan ctx1 pada inisialisasi grafik kedua
                                            const ctx1 = document.getElementById('grafikSaya1').getContext('2d');
                                            const grafikSaya1 = new Chart(ctx1, {
                                                type: 'line',
                                                data: {
                                                    labels: ['Januari', 'Februari', 'Maret', 'April', 'Mei'],
                                                    datasets: [{
                                                        label: 'Penjualan Produk B',
                                                        data:[1,2,3,4,5,6],
                                                        backgroundColor: 'rgba(255, 99, 132, 0.5)',
                                                        borderColor: 'rgba(255, 99, 132, 1)',
                                                        borderWidth: 1
                                                    }]
                                                },
                                                options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
                                            });
                                        </script>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>
<script src="/js/script.js"></script>

</html>
